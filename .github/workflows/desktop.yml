name: Build Windows app

# Test build:  Actions tab -> Build Windows app -> Run workflow   (download from Artifacts)
# Real release (auto-updates installed copies):  git tag v1.0.1 && git push --tags
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bundle the web app into the desktop shell
        shell: bash
        run: |
          mkdir -p desktop/app desktop/build
          cp -r index.html store.html manifest.json sw.js css js assets desktop/app/
          cp assets/icon-512.png desktop/build/icon.png
          V="${GITHUB_REF_NAME#v}"; case "$GITHUB_REF" in refs/tags/v*) ;; *) V="test";; esac
          printf "window.BILLAURA_VERSION='%s';\nwindow.BILLAURA_CHANNEL='exe';\n" "$V" > desktop/app/js/version.js
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Install
        working-directory: desktop
        run: npm install
      - name: Build (test run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: desktop
        run: npm run dist
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: Billaura-Windows
          path: desktop/dist/*.exe
