<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billaura</title>
<style>html,body{margin:0;height:100%;background:#F5F6FA;font-family:Roboto,Arial,sans-serif;color:#1B2133}body{display:flex;align-items:center;justify-content:center;text-align:center}a{color:#EF1A3C;font-weight:700}</style></head>
<body><div id="m"><h2>Opening store…</h2></div>
<script>
// GitHub Pages serves this file for any unknown path, so  /billaura/store/<name>  lands here and is forwarded to the store page.
(function () {
  var m = location.pathname.match(/^(.*\/)store\/([^\/]+)\/?$/);
  if (m) { location.replace(m[1] + 'store.html?s=' + encodeURIComponent(m[2])); return; }
  document.getElementById('m').innerHTML = '<h2>Page not found</h2><p><a href="./">Go to Billaura</a></p>';
})();
</script></body></html>
