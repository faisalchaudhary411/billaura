<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#E8173C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Billaura – Smart Billing, Inventory, Parties & Business management" />
  <meta name="copyright" content="© Billaura. All rights reserved." />
  <title>Billaura</title>
  <style>html,body{background:#E8173C;margin:0}#bootScreen{position:fixed;inset:0;z-index:1500;background:#E8173C;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:Roboto,Arial,sans-serif}</style>
  <script>/* first-visit landing redirect (website only) */
(function(){try{var l=location,q=l.search.indexOf('app=1')>-1;
if(q){localStorage.setItem('billaura_seen_v1','1');return}
if(navigator.standalone||window.Capacitor||l.protocol==='billaura:'||l.protocol==='file:'||/^(localhost|127\.|192\.168\.)/.test(l.hostname)||l.hash||l.search)return;
if(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)return;
if(localStorage.getItem('billaura_seen_v1')||localStorage.getItem('sb_invoices_v2')||localStorage.getItem('sb_products_v2'))return;
for(var i=0;i<localStorage.length;i++){if(/auth-token|session/i.test(localStorage.key(i)))return}
l.replace('landing.html')}catch(e){}})();</script>
  <script>if(navigator.standalone||window.Capacitor){document.documentElement.className+=" ios-app native-shell"}</script>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <div id="bootScreen" class="splash">
    <i class="sp-orb sp-o1"></i><i class="sp-orb sp-o2"></i>
    <div class="splash-in">
      <span class="sp-ring"></span><span class="sp-ring r2"></span>
      <img src="assets/icon-maskable-512.png" alt="" class="splash-logo" width="160" height="160" />
      <div class="splash-name">Billaura</div>
      <div class="splash-tag"><span>Billing</span><b></b><span>Inventory</span><b></b><span>Accounts</span></div>
      <div class="splash-bar"><i></i></div>
      <p id="bootMsg" class="splash-msg">Loading…</p>
      <noscript><p style="color:#fff;text-align:center">JavaScript is required. Enable JS and reload.</p></noscript>
    </div>
    <div class="splash-foot">© 2026 Billaura. All rights reserved.</div>
  </div>
  <div id="authScreen" class="auth-screen" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="installBanner" class="install-banner" hidden>
    <span>Install Billaura on your home screen</span>
    <button type="button" id="installBtn" class="btn btn-primary btn-sm">Install</button>
    <button type="button" id="installDismiss" class="btn btn-ghost btn-sm">✕</button>
  </div>
  <div id="updateBanner" class="update-banner" hidden>
    <span>New version available</span>
    <button type="button" id="updateBtn" class="btn btn-sm">Update</button>
  </div>
  <div id="app" hidden>
    <aside class="side-nav" id="sideNav" aria-label="Main menu"></aside>
    <header class="app-header" id="appHeader">
      <div class="header-left">
        <button class="icon-btn back-btn" id="backBtn" hidden aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <img id="headerLogo" class="header-logo" src="assets/logo.svg" alt="" width="28" height="28" onerror="this.style.display='none'" />
        <h1 class="header-title" id="headerTitle">Billaura</h1>
      </div>
      <div class="header-right" id="headerRight"></div>
    </header>

    <main class="app-content" id="appContent"></main>

    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item active" data-view="home" aria-label="Home">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>
      </button>
      <button class="nav-item" data-view="dashboard" aria-label="Dashboard">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="9" rx="1"/>
          <rect x="14" y="3" width="7" height="5" rx="1"/>
          <rect x="14" y="12" width="7" height="9" rx="1"/>
          <rect x="3" y="16" width="7" height="5" rx="1"/>
        </svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-view="products" aria-label="Items">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        <span>Items</span>
      </button>
      <button class="nav-item" data-view="more" aria-label="Menu">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
        <span>Menu</span>
      </button>
      <button class="nav-item nav-desktop" id="navDesktop" data-action="desktop-info" aria-label="PC App">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M8 20.5h8M12 16.5v4"/><path d="M9 10.2l2.2 2.2 3.8-4.4" stroke="#EF1A3C"/></svg>
        <span>PC App</span>
      </button>
    </nav>

    <div id="modalRoot"></div>
    <div id="scannerRoot"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/license-config.js"></script>
  <script src="js/license.js"></script>
  <script src="js/freemium.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/receipt.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/labels.js"></script>
  <script src="js/version.js"></script>
  <script src="js/native.js"></script>
  <script src="js/counter.js"></script>
  <script src="js/branches.js"></script>
  <script src="js/easy.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
